kind: Service
apiVersion: v1
metadata:
  name: simpleblog
  labels:
    app: simpleblog
spec:
  type: ClusterIP
  selector:
    app: simpleblog
  ports:
    - name: tcp
      port: 8080
      protocol: TCP
      targetPort: 8080
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: simpleblog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simpleblog
  template:
    metadata:
      labels:
        app: simpleblog
        version: v1
    spec:
      containers:
      - name: simpleblog
        image: simpleblog
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
